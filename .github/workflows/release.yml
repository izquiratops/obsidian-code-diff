name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify release assets
        run: |
          set -e
          for file in dist/main.js manifest.json styles.css; do
            [ -f "$file" ] || { echo "::error::Missing required file: $file"; exit 1; }
          done
          # Obsidian requires manifest.json version to match the release tag
          tag="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$manifest_version" != "$tag" ]; then
            echo "::error::manifest.json version ($manifest_version) does not match release tag ($tag)"
            exit 1
          fi

      - name: Attach files to release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            dist/main.js
            manifest.json
            styles.css
